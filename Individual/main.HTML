<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Document</title>



</head>
<body>

    <div class="header">
        <h4>Opiskelijaravintolat</h4>
        <button class="button">Log out</button>
        <img src="./public/3e6d367322bd5ef511216c3576dfa4e0.png"alt="Profile picture" class="profile">

    </div>

    <div class="hero-header">
  <h1>Student restaurants in Finland</h1>
  <p class="subtitle">
    <span>Find your campus lunch: filter by city or provider, spot the closest</span>
    <span>kitchen on the map, and read the menu for today or the whole week.</span>
  </p>
</div>


<div class="filter-card">
  <h2 class="filter-title">FILTER</h2>

  <div class="form-group">
    <label for="search-input">Search</label>
    <input 
      type="text" 
      id="search-input" 
      placeholder="Name or address"
    />
  </div>

  <div class="form-group">
    <label for="city-select">City</label>
    <select id="city-select">
      <option value="">All cities</option>
      <option value="Helsinki">Helsinki</option>
      <option value="Espoo">Espoo</option>
      <option value="Vantaa">Vantaa</option>
    </select>
  </div>
  <div class="form-group">
    <label for="provider-select">Provider</label>
    <select id="provider-select">
      <option value="">All providers</option>
      <option value="Compass Group">Compass Group</option>
      <option value="Sodexo">Sodexo</option>
    </select>
  </div>
  <div class="checkbox-group">
    <input type="checkbox" id="fav-checkbox" />
    <label for="fav-checkbox">Favourites only</label>
  </div>

  <button type="button" class="btn-nearest">Find nearest restaurant</button>
  <button type="button" class="btn-reset">Reset filters</button>
</div>



<div class="menu-header-bar">
  <span class="restaurant-count">0 RESTAURANTS</span>
  
  <div class="toggle-switch">
    <button type="button" class="toggle-btn active">Daily menu</button>
    <button type="button" class="toggle-btn">Weekly menu</button>
  </div>
</div>


<div class="map-container">
  <iframe 
    src="https://www.openstreetmap.org/export/embed.html?bbox=18.0000%2C59.5000%2C34.0000%2C70.5000&amp;layer=mapnik" 
    title="Finland Map">
  </iframe>
</div>

<script src="./main.js"></script>



    
    
</body>
</html>
