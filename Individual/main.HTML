<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <title>Student Restaurants</title>
</head>
<body>

    <div class="header">
        <h4>Opiskelijaravintolat</h4>
        <button class="button" id="logout">Log out</button>
        <label for="profile-upload">
            <img 
                src="./public/3e6d367322bd5ef511216c3576dfa4e0.png"
                alt="Profile picture"
                class="profile"
                id="profile-picture"
            >
        </label>
        <input type="file" id="profile-upload" accept="image/*">
    </div>

    <div class="hero-header">
        <h1>Student restaurants in Finland</h1>
        <p class="subtitle">
            <span>Find your campus lunch: filter by city or provider, spot the closest</span>
            <span>kitchen on the map, and read the menu for today or the whole week.</span>
        </p>
    </div>

    <div class="filter-card">
        <h2 class="filter-title">FILTER</h2>

        <div class="form-group">
            <label for="search-input">Search</label>
            <input 
                type="text" 
                id="search-input" 
                placeholder="Name or address"
            />
        </div>

        <div class="form-group">
            <label for="city-select">City</label>
            <select id="city-select">
                <option value="">All cities</option>
                <option value="Helsinki">Helsinki</option>
                <option value="Espoo">Espoo</option>
                <option value="Vantaa">Vantaa</option>
            </select>
        </div>

        <div class="form-group">
            <label for="provider-select">Provider</label>
            <select id="provider-select">
                <option value="">All providers</option>
                <option value="Compass Group">Compass Group</option>
                <option value="Sodexo">Sodexo</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="fav-checkbox" />
            <label for="fav-checkbox">Favourites only</label>
        </div>

        <button type="button" class="btn-nearest" id="btn-nearest">Find nearest restaurant</button>
        <button type="button" class="btn-reset" id="btn-reset">Reset filters</button>
    </div>

    <div class="menu-header-bar">
        <span class="restaurant-count" id="restaurant-count">0 RESTAURANTS</span>
        
        <div class="toggle-switch">
            <button type="button" class="toggle-btn active" id="btn-daily">Daily menu</button>
            <button type="button" class="toggle-btn" id="btn-weekly">Weekly menu</button>
            <button type="button" class="toggle-btn" id="btn-weekly2">menu</button>
        </div>
    </div>

    <div class="map-container" id="map"></div>

    <div id="restaurant-list" class="restaurant-list"></div>

    <script src="./main.js"></script>
</body>
</html>
